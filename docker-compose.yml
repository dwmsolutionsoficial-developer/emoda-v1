services:
  backend:
    build: ./backend
    container_name: emoda-v1-backend
    restart: always
    ports:
      # 4000 (e-moda) e 4001 (e-clinica) já estão em uso no servidor
      - "${HOST_PORT:-4002}:4000"
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    networks:
      - emoda-v1-net

networks:
  emoda-v1-net:
    driver: bridge
