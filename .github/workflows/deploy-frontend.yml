name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'emoda-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Vue CLI 3 + webpack 4 quebram com o OpenSSL 3 do Node 18+.
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
          cache-dependency-path: emoda-frontend/yarn.lock

      # file-saver está travado no yarn.lock via git+ssh; o runner não tem chave SSH do GitHub.
      - name: Usar HTTPS para dependências vindas do git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Instalar dependências
        working-directory: emoda-frontend
        run: yarn install --frozen-lockfile

      - name: Gerar build
        run: ./scripts/build-frontend.sh

      - name: Copiar build para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "emoda-frontend/dist/"
          target: "/apps/emoda-v1/frontend"
          strip_components: 2

      # O Nginx serve os estáticos direto do disco: reload só seria preciso se a
      # configuração mudasse. Em vez disso, confirmamos que o site responde.
      - name: Verificar o site no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            test -f /apps/emoda-v1/frontend/index.html
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: www.emodaapp.com.br" http://localhost/)
            echo "frontend respondeu HTTP $code"
            test "$code" = "200"
