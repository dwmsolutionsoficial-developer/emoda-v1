name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'emoda-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Vue CLI 3 + webpack 4 quebram com o OpenSSL 3 do Node 18+.
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
          cache-dependency-path: emoda-frontend/yarn.lock

      # file-saver está travado no yarn.lock via git+ssh; o runner não tem chave SSH do GitHub.
      - name: Usar HTTPS para dependências vindas do git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      # O vue-cli-service 3 conclui o build mas não encerra o processo no runner
      # (o step ficava pendurado após "Build complete"). Por isso o timeout com
      # verificação do artefato: só passa se o dist foi realmente gerado.
      - name: Instalar dependências e gerar build
        working-directory: emoda-frontend
        run: |
          yarn install --frozen-lockfile
          timeout 900 yarn build; code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then exit $code; fi
          test -f dist/index.html || { echo "::error::build não gerou dist/index.html"; exit 1; }
          echo "build ok"

      - name: Copiar build para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "emoda-frontend/dist/"
          target: "/apps/emoda-v1/frontend"
          strip_components: 2

      - name: Recarregar Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo systemctl reload nginx
