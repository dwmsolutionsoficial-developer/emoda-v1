name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: emoda-backend/package-lock.json

      - name: Instalar dependências
        working-directory: emoda-backend
        run: npm ci

      # Informativo: o código legado ainda não passa limpo no eslint:recommended,
      # então o lint não bloqueia o merge.
      - name: Lint
        working-directory: emoda-backend
        continue-on-error: true
        run: npm run lint

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Vue CLI 3 + webpack 4 quebram com o OpenSSL 3 do Node 18+.
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
          cache-dependency-path: emoda-frontend/yarn.lock

      # file-saver está travado no yarn.lock via git+ssh; o runner não tem chave SSH do GitHub.
      - name: Usar HTTPS para dependências vindas do git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      # O vue-cli-service 3 conclui o build mas não encerra o processo no runner
      # (o step ficava pendurado após "Build complete"). Por isso o timeout com
      # verificação do artefato: só passa se o dist foi realmente gerado.
      - name: Instalar dependências e gerar build
        working-directory: emoda-frontend
        run: |
          yarn install --frozen-lockfile
          timeout 900 yarn build; code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then exit $code; fi
          test -f dist/index.html || { echo "::error::build não gerou dist/index.html"; exit 1; }
          echo "build ok"
